name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The race detector needs cgo, which the runner has.
      - run: go test -race ./...
      - run: go run ./cmd/rightsizing-check scan testdata/sample.yaml --csv testdata/usage.csv
      - run: go run ./cmd/rightsizing-check scan -f json testdata/sample.yaml --csv testdata/usage.csv > /dev/null
      - run: go run ./cmd/rightsizing-check explain RC001
